<style>
  body { margin: 0; padding: 0 12px 16px; font-size: 13px; font-family: Arial, sans-serif; }
  input, select, textarea, button { font: inherit; }
  input[type=text], input[type=number], input[type=password], select, textarea { border: 1px solid #dadce0; border-radius: 4px; padding: 5px 6px; background: #fff; }
  button { border: 1px solid #dadce0; border-radius: 4px; padding: 6px 12px; background: #fff; cursor: pointer; }
  button.action { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .6; cursor: default; }
  .tabs { display: flex; margin: 0 -12px 10px; border-bottom: 1px solid #dadce0; }
  .tab { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0 8px; font-size: 13px; color: #5f6368; cursor: pointer; border-radius: 0; }
  .tab.active { color: #000; border-bottom-color: #000; font-weight: bold; }
  .panel { padding-top: 2px; }
  .block { margin-top: 12px; }
  .form-group { margin-top: 10px; }
  .form-group label { display: block; margin-bottom: 3px; }
  .form-group input[type=text], .form-group input[type=number], .form-group input[type=password],
  .form-group select, .form-group textarea { width: 100%; box-sizing: border-box; }
  .form-group textarea { min-height: 52px; resize: vertical; }
  .inline { display: flex; gap: 6px; }
  .inline input { flex: 1; }
  .inline button { white-space: nowrap; }
  .muted { color: #5f6368; }
  .small { font-size: 11px; }
  .required { color: #c5221f; }
  .banner { background: #fef7e0; border: 1px solid #f9e3a3; padding: 8px 10px; border-radius: 4px; margin-top: 10px; }
  .card { border: 1px solid #dadce0; border-radius: 6px; padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 13px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .status { margin-top: 10px; padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  .status.ok { background: #e6f4ea; color: #137333; }
  .status.error { background: #fce8e6; color: #c5221f; }
  .status.busy { background: #e8f0fe; color: #174ea6; }
  .linklike { background: none; border: 0; padding: 0; margin-top: 6px; color: #1a73e8; cursor: pointer; font-size: 12px; }
  .schedule { border: 1px solid #dadce0; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
  .schedule .name { font-weight: bold; }
  .schedule .meta { color: #5f6368; font-size: 11px; margin-top: 2px; }
  .schedule .last.error { color: #c5221f; }
  .schedule .last.ok { color: #137333; }
  details summary { cursor: pointer; font-weight: bold; }
  code { background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
</style>
