name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog is up to date with the spec
        run: python3 scripts/generate_catalog.py --check
      - name: Unit tests
        run: node --test "test/**/*.test.js"
      - name: Manifest is valid JSON with the expected scopes
        run: |
          node -e "
            const m = require('./src/appsscript.json');
            const want = ['https://www.googleapis.com/auth/spreadsheets.currentonly','https://www.googleapis.com/auth/script.container.ui','https://www.googleapis.com/auth/script.external_request','https://www.googleapis.com/auth/script.scriptapp'];
            if (JSON.stringify(m.oauthScopes) !== JSON.stringify(want)) { console.error('unexpected scopes', m.oauthScopes); process.exit(1); }
            if (m.runtimeVersion !== 'V8') process.exit(1);
            console.log('manifest ok');
          "
